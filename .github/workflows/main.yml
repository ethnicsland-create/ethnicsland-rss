name: Update Ethnics Land RSS

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate RSS 2.0 from Shopify
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import formatdate
          from html import unescape
          import re

          feed_url = "https://ethnicsland.com/blogs/indian-handloom-blog.atom"

          data = urllib.request.urlopen(feed_url, timeout=30).read()
          root = ET.fromstring(data)

          ns = {
              "atom": "http://www.w3.org/2005/Atom"
          }

          rss = ET.Element(
              "rss",
              {
                  "version": "2.0",
                  "xmlns:media": "http://search.yahoo.com/mrss/"
              }
          )

          channel = ET.SubElement(rss, "channel")

          ET.SubElement(channel, "title").text = "Ethnics Land – Indian Handloom Blog"
          ET.SubElement(channel, "link").text = "https://ethnicsland.com/blogs/indian-handloom-blog"
          ET.SubElement(
              channel,
              "description"
          ).text = "Discover Indian handloom sarees, weaving traditions, fabrics, artisans, styling ideas and the stories behind India's rich textile heritage."
          ET.SubElement(channel, "language").text = "en-IN"
          ET.SubElement(channel, "lastBuildDate").text = formatdate(usegmt=True)

          for entry in root.findall("atom:entry", ns):

              item = ET.SubElement(channel, "item")

              title = entry.find("atom:title", ns)
              ET.SubElement(item, "title").text = (
                  title.text.strip() if title is not None else "Ethnics Land Blog"
              )

              link = ""

              for link_el in entry.findall("atom:link", ns):
                  if link_el.get("rel", "alternate") == "alternate":
                      link = link_el.get("href", "")
                      break

              if not link:
                  link_el = entry.find("atom:link", ns)
                  if link_el is not None:
                      link = link_el.get("href", "")

              ET.SubElement(item, "link").text = link
              ET.SubElement(
                  item,
                  "guid",
                  {"isPermaLink": "true"}
              ).text = link

              summary = entry.find("atom:summary", ns)

              if summary is not None:
                  description = summary.text or ""
              else:
                  description = ""

              description = unescape(description)

              ET.SubElement(item, "description").text = description

          ET.indent(rss, space="  ")

          tree = ET.ElementTree(rss)
          tree.write(
              "rss.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          print("RSS feed updated successfully.")
          PY

      - name: Commit updated RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rss.xml

          git diff --cached --quiet || git commit -m "Auto-update RSS feed"

          git push
